<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a href="{{ '/' | relative_url }}" class="nav-logo">PM</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Writing</a>
        <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a>
      </div>
    </nav>
  </header>

  <main class="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>{{ site.author }}</p>
      <div class="footer-links">
        <a href="https://github.com/{{ site.github_username }}" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/{{ site.linkedin }}" target="_blank">LinkedIn</a>
      </div>
    </div>
  </footer>

</body>
</html>
